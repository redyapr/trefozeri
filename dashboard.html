<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TREFOZERI — Cockpit</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --tx:#e6e8ec; --mut:#8b93a1; --dim:#5f6672;
    --buy:#37c07a; --sell:#e5534b; --neu:#8b93a1; --amber:#e0a54b; --accent:#4a90e2;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       font-size:14px;line-height:1.5;padding:16px;max-width:900px;margin:0 auto}
  a{color:var(--accent)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
       padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .title{font-size:18px;font-weight:600;letter-spacing:.3px}
  .chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--card2);color:var(--mut)}
  .right{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:1px;margin-right:5px}
  button{font:inherit;font-size:12px;color:var(--tx);background:var(--card2);border:1px solid var(--line);
         border-radius:8px;padding:5px 11px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .badge{display:inline-flex;align-items:center;gap:8px;font-size:20px;font-weight:700;
         padding:6px 14px;border-radius:10px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
  .kv .k{color:var(--mut)} .kv .v{text-align:right;font-family:var(--mono)}
  .prog{height:6px;border-radius:999px;background:var(--card2);overflow:hidden;margin:10px 0}
  .prog>span{display:block;height:100%}
  .comp{display:grid;grid-template-columns:82px 1fr auto;align-items:center;gap:10px;margin:9px 0}
  .comp .nm{font-size:12px;color:var(--mut)}
  .track{position:relative;height:8px;background:var(--card2);border-radius:999px}
  .track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--dim)}
  .track .seg{position:absolute;top:0;bottom:0}
  .comp .val{font-family:var(--mono);font-size:12px;min-width:96px;text-align:right}
  .muted{color:var(--mut)} .mono{font-family:var(--mono)}
  .foot{margin-top:16px;font-size:12px;color:var(--dim);font-style:italic}
  .notice{background:#3a2f1a;border:1px solid #5c4a22;color:#e0c185;font-size:12px;
          padding:8px 12px;border-radius:8px;margin-bottom:14px;display:none}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:2px}
  .metric{background:var(--card2);border-radius:8px;padding:9px 10px}
  .metric .l{font-size:11px;color:var(--mut)} .metric .n{font-size:18px;font-weight:600}
</style>
</head>
<body>
  <div class="bar">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="title">TREFOZERI</span><span class="muted" style="font-size:12px">cockpit</span>
      <span class="chip" id="inst">—</span>
    </div>
    <div class="right">
      <span id="updated">—</span>
      <label style="cursor:pointer"><input type="checkbox" id="auto" checked> auto</label>
      <button id="refresh">refresh</button>
    </div>
  </div>

  <div class="notice" id="notice"></div>

  <div class="grid">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span class="badge" id="badge">—</span>
        <div style="text-align:right">
          <div class="muted" style="font-size:12px">confidence</div>
          <div id="conf" style="font-size:22px;font-weight:700">—</div>
        </div>
      </div>
      <div class="prog"><span id="confbar" style="width:0"></span></div>
      <div class="kv">
        <span class="k">price</span><span class="v" id="price">—</span>
        <span class="k">score</span><span class="v" id="score">—</span>
        <span class="k">session</span><span class="v" id="session">—</span>
        <span class="k">news</span><span class="v" id="news">—</span>
      </div>
    </div>

    <div class="card" id="levelsCard">
      <h3>Entry &amp; targets</h3>
      <div id="levels" class="kv"></div>
      <div id="standaside" class="muted" style="display:none">Stand aside — no entry.</div>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <h3>Confluence</h3>
    <div id="comps"></div>
    <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-size:13px">
      <span class="muted">combined score</span><span class="mono" id="combined">—</span>
    </div>
  </div>

  <div class="card" id="aiCard" style="margin-top:12px;display:none">
    <h3>Analysis</h3>
    <div id="ai" class="muted" style="color:var(--tx)"></div>
  </div>

  <div class="card" id="btCard" style="margin-top:12px;display:none">
    <h3>Backtest snapshot</h3>
    <div class="metrics" id="bt"></div>
  </div>

  <div class="foot" id="foot">⚠️ Not investment advice. Risk management is your responsibility.</div>

<script>
"use strict";
const POLL_MS = 15000;
const SAMPLE = {
  symbol:"XAU/USD", timestamp:"2026-06-30T12:34:00+00:00", direction:"BUY",
  confidence:72.2, score:0.465, price:3320.10, sl:3312.50, tp1:3325.10, tp2:3332.60, tp3:3340.10,
  session:"London", news_flag:"clear (sample)",
  entry_zone:{low:3315.10, high:3320.10, mid:3317.60},
  entries:[{portion:0.5,type:"market",price:3320.10},{portion:0.5,type:"limit",price:3315.10}],
  rr:{tp1:1.5, tp2:3.0, tp3:4.5}, valid_bars:8,
  components:{
    dark_point:{score:0.50,quality:0.55,direction:"BUY"},
    homma:{score:0.40,quality:0.60,direction:"BUY"},
    cot:{score:0.50,quality:0.60,direction:"BUY"},
    mdp_proxy:{score:0.30,quality:0.50,direction:"BUY"}
  },
  rationale:""
};
const $=id=>document.getElementById(id);
const fmt=(v,d=2)=>v==null?"—":Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const dirColor=d=>d==="BUY"?"var(--buy)":d==="SELL"?"var(--sell)":"var(--neu)";
const dirTint=d=>d==="BUY"?"rgba(55,192,122,.15)":d==="SELL"?"rgba(229,83,75,.15)":"rgba(139,147,161,.15)";

function freshness(ts){
  const t=Date.parse(ts); if(isNaN(t)) return {txt:"—",col:"var(--dim)"};
  const min=(Date.now()-t)/60000;
  const rel=min<1?"just now":min<60?Math.round(min)+" min ago":Math.round(min/60)+" h ago";
  const col=min<=15?"var(--buy)":min<=60?"var(--amber)":"var(--sell)";
  return {txt:"updated "+rel,col};
}

function compRow(name,c){
  const s=Math.max(-1,Math.min(1,c.score||0)), pos=s>=0, w=Math.round(Math.abs(s)*50);
  const col=pos?"var(--buy)":"var(--sell)";
  const seg=pos
    ? `left:50%;width:${w}%;border-radius:0 999px 999px 0;background:${col}`
    : `right:50%;width:${w}%;border-radius:999px 0 0 999px;background:${col}`;
  return `<div class="comp"><span class="nm">${name}</span>
    <div class="track"><div class="mid"></div><div class="seg" style="${seg}"></div></div>
    <span class="val" style="color:${col}">${s>=0?"+":"−"}${Math.abs(s).toFixed(2)} · [${c.direction}] q${(c.quality||0).toFixed(2)}</span></div>`;
}

function render(s, live){
  $("inst").textContent = (s.symbol||"—")+"  ·  "+(s.session||"");
  const f=freshness(s.timestamp);
  $("updated").innerHTML = `<span class="dot" style="background:${f.col}"></span>${f.txt}`;
  const d=s.direction||"NEUTRAL";
  const icon=d==="BUY"?"🟢":d==="SELL"?"🔴":"⚪";
  const b=$("badge"); b.textContent=icon+" "+d; b.style.color=dirColor(d); b.style.background=dirTint(d);
  $("conf").textContent=fmt(s.confidence,1)+"%"; $("conf").style.color=dirColor(d);
  const cb=$("confbar"); cb.style.width=Math.max(0,Math.min(100,s.confidence||0))+"%"; cb.style.background=dirColor(d);
  $("price").textContent=fmt(s.price); $("score").textContent=(s.score>=0?"+":"")+fmt(s.score,3);
  $("session").textContent=s.session||"—"; $("news").textContent=s.news_flag||"—";

  // levels
  const rr=s.rr||{}; const dir=d;
  if(dir==="BUY"||dir==="SELL"){
    $("standaside").style.display="none";
    const z=s.entry_zone||{};
    let ent=""; (s.entries||[]).forEach(e=>{ent+=`<span class="k">${Math.round(e.portion*100)}% ${e.type}</span><span class="v">${fmt(e.price)}</span>`;});
    $("levels").innerHTML=
      `<span class="k">entry zone</span><span class="v">${fmt(z.low)} – ${fmt(z.high)}</span>`+
      ent+
      `<span class="k">SL</span><span class="v" style="color:var(--sell)">${fmt(s.sl)}</span>`+
      `<span class="k">TP1</span><span class="v" style="color:var(--buy)">${fmt(s.tp1)} <span class="muted">(${rr.tp1??"—"}R)</span></span>`+
      `<span class="k">TP2</span><span class="v" style="color:var(--buy)">${fmt(s.tp2)} <span class="muted">(${rr.tp2??"—"}R)</span></span>`+
      `<span class="k">TP3</span><span class="v" style="color:var(--buy)">${fmt(s.tp3)} <span class="muted">(${rr.tp3??"—"}R)</span></span>`+
      `<span class="k">valid</span><span class="v">~${s.valid_bars??"—"} bars</span>`;
    $("levels").style.display="grid";
  } else {
    $("levels").style.display="none"; $("standaside").style.display="block";
  }

  // components
  const c=s.components||{};
  const order=[["dark_point","Dark Point"],["homma","Homma"],["cot","COT"],["mdp_proxy","MDP-proxy"]];
  $("comps").innerHTML=order.filter(([k])=>c[k]).map(([k,nm])=>compRow(nm,c[k])).join("");
  $("combined").textContent=(s.score>=0?"+":"")+fmt(s.score,3);

  // analysis
  if(s.rationale && s.rationale.trim()){ $("aiCard").style.display="block"; $("ai").textContent=s.rationale; }
  else $("aiCard").style.display="none";

  $("notice").style.display = live ? "none" : "block";
  if(!live) $("notice").textContent="Showing sample data — serve this folder over HTTP (see below) so the dashboard can read live signal.json.";
}

async function loadBacktest(){
  try{
    const r=await fetch("backtest_summary.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw 0;
    const m=await r.json();
    $("bt").innerHTML=[
      ["win rate", (m.win_rate_pct??"—")+"%"],
      ["expectancy", (m.expectancy_R??"—")+" R"],
      ["profit factor", m.profit_factor??"—"],
      ["max DD", (m.max_drawdown_R??"—")+" R"],
    ].map(([l,n])=>`<div class="metric"><div class="l">${l}</div><div class="n">${n}</div></div>`).join("");
    $("btCard").style.display="block";
  }catch(e){ $("btCard").style.display="none"; }
}

async function tick(){
  try{
    const r=await fetch("signal.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw 0;
    render(await r.json(), true);
  }catch(e){ render(SAMPLE, false); }
  loadBacktest();
}

$("refresh").onclick=tick;
let timer=null;
function schedule(){ clearInterval(timer); if($("auto").checked) timer=setInterval(tick,POLL_MS); }
$("auto").onchange=schedule;
tick(); schedule();
</script>
</body>
</html>
