name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # Refreshes price & calendar data roughly every 15 minutes. This matches (and
    # doesn't exceed) the dashboard's own refresh throttling — H1 candles are only
    # refetched every 20 minutes even on a manual click (see minRefetchMs in
    # src/lib/twelveData.js) — so this cadence never leaves the static snapshot
    # staler than the app already tolerates.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write # the build job commits data/signal-history.json back to the repo (see below)
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather than
# canceling it, since a cron tick and a code push could otherwise race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Writes public/data/*.json — see scripts/fetch-data.mjs for why GitHub Pages
      # needs this pre-fetched instead of proxied on demand.
      - name: Fetch quote & calendar data
        run: node scripts/fetch-data.mjs
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

      # data/signal-history.json is the one piece of state that has to survive across
      # otherwise-stateless CI runs (see scripts/fetch-data.mjs) — everything else here
      # is regenerated fresh every time. Only commits when the record actually changed
      # (new signal opened, or one hit its SL/TP), so this doesn't spam a commit every
      # 15 minutes. Pushing with the default GITHUB_TOKEN is safe from a trigger-loop
      # standpoint: GitHub doesn't fire `on: push` for commits made with that token.
      - name: Persist shared signal track record
        run: |
          git add data/signal-history.json
          if git diff --cached --quiet; then
            echo "No signal track record changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update signal track record"
            git push
          fi

      - name: Build
        run: npm run build
        env:
          GH_PAGES: 'true'

      # The default GITHUB_TOKEN this workflow runs with deliberately can't create a
      # Pages site from scratch (that needs repo-admin-level API access) — Settings →
      # Pages → Source: GitHub Actions has to be set by hand, once, by a repo admin,
      # before this step's Get-Pages-site call has anything to find.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
