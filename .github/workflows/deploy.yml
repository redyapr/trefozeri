name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # Refreshes price & calendar data roughly every 15 minutes. This matches (and
    # doesn't exceed) the dashboard's own refresh throttling — each timeframe only
    # actually refetches on its own cadence (e.g. H1 every 20 minutes, D1 every 4
    # hours, see minRefetchMs in src/lib/twelveData.js) — so this cadence never
    # leaves the static snapshot staler than the app already tolerates.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Deliberately no workflow-level `permissions:` block — each job below declares
# only what it actually needs, so a compromised/typo'd step in one job can't
# reach a token scope the other job never asked for.

# Only one Pages deployment at a time; let an in-flight one finish rather than
# canceling it, since a cron tick and a code push could otherwise race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits data/signal-history.json back to the repo (see below)
      pages: write # needed by configure-pages/upload-pages-artifact below
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gates everything below: a failing test here stops the job before it can fetch,
      # commit, build, or deploy anything.
      - name: Run tests
        run: npm test

      # Writes public/data/*.json — see scripts/fetch-data.mjs for why GitHub Pages
      # needs this pre-fetched instead of proxied on demand. Also sends Telegram
      # notifications for new/closed signals (XAUUSD only for now) to TELEGRAM_CHAT_ID,
      # and separately alerts TELEGRAM_PERSONAL_CHAT_ID (a private DM, not the public
      # channel) if a data source or the whole run fails. All three are optional;
      # sendTelegramMessage()/sendAdminAlert() no-op if their target is unset.
      - name: Fetch quote & calendar data
        run: node scripts/fetch-data.mjs
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
          # Not a secret — a repository *variable*. Only needed on a fork/rename/domain
          # change; defaults to this repo's own deployment when unset.
          SITE_URL: ${{ vars.SITE_URL }}

      # data/signal-history.json, data/last-alert.json and data/last-report.json are the
      # state that has to survive across otherwise-stateless CI runs (see
      # scripts/fetch-data.mjs) — everything else here is regenerated fresh every time.
      # Only commits when something actually changed (a new signal opened/hit its
      # SL-TP, an admin alert fired, or the daily/weekly report sent), so this doesn't
      # spam a commit every 15 minutes. Pushing with the default GITHUB_TOKEN is safe
      # from a trigger-loop standpoint: GitHub doesn't fire `on: push` for commits made
      # with that token.
      - name: Persist shared signal track record
        run: |
          git add data/signal-history.json data/last-alert.json data/last-report.json
          if git diff --cached --quiet; then
            echo "No signal track record changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update signal track record"

            # A push can be rejected if something else landed on master in the narrow
            # window between this run's checkout and this step (e.g. a manual push
            # racing a cron tick) — rebase onto whatever's now there and retry a couple
            # of times before actually failing the job.
            pushed=false
            for attempt in 1 2 3; do
              if git push; then
                pushed=true
                break
              fi
              echo "Push rejected (attempt $attempt/3) — rebasing onto latest master and retrying..."
              git pull --rebase origin master
            done
            if [ "$pushed" = false ]; then
              echo "::error::Failed to push the signal track record after 3 attempts"
              exit 1
            fi
          fi

      - name: Build
        run: npm run build
        env:
          GH_PAGES: 'true'

      # The default GITHUB_TOKEN this workflow runs with deliberately can't create a
      # Pages site from scratch (that needs repo-admin-level API access) — Settings →
      # Pages → Source: GitHub Actions has to be set by hand, once, by a repo admin,
      # before this step's Get-Pages-site call has anything to find.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
