name: Backfill Telegram reply (one-off)

# Manual-only, one-off utility — not part of the normal deploy/cron flow (see
# deploy.yml for that). Sends a single hardcoded "ENTRY FILLED" reply to a specific
# already-sent Telegram message (see scripts/backfill-telegram-reply.mjs) for a fill
# the fill-race bug (fixed in 5eecc7f) caused to silently vanish before the bot ever
# got a chance to post its own reply. Safe to delete this workflow + its script once
# run once — trigger it from the Actions tab: this workflow -> "Run workflow".
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/backfill-telegram-reply.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
