name: One-off TP1 correction (2026-08-26)

# ONE-OFF, SINGLE-USE — see scripts/one-off-tp1-correction.mjs's own comment. Manual
# dispatch only, never scheduled. Both this file and the script it runs are deleted in
# the same commit that reports this having run successfully.
on:
  workflow_dispatch:

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # no commit in this run — see the step's own comment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 2026-08-26: the original run (scripts/one-off-tp1-correction.mjs) already
      # corrected data/signal-history.json and the 3 close-reply text edits — both
      # committed and confirmed. Its 2 daily-report edits silently failed (wrong Bot
      # API method for a photo caption — see the captions script's own comment), so
      # this now points at the follow-up instead. No commit step needed: the data
      # itself isn't changing here, only the already-posted report captions.
      - name: Fix the 2 daily-report captions
        run: node scripts/one-off-tp1-correction-captions.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
