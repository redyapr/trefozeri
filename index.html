<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b3a6b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="S/R Dashboard" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>TREFOZERI · S/R Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <img src="/trefozeri-logo.png" alt="TREFOZERI" class="brand-logo" />
          <div class="brand-text">
            <nav id="symbol-tabs" class="symbol-tabs"></nav>
            <h1 class="brand-title">Support &amp; Resistance</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="price-block">
            <span class="price-label">Spot</span>
            <span id="price-display" class="price-display">—</span>
          </div>
          <button id="notify-btn" class="icon-btn" title="Enable price alerts" aria-label="Enable price alerts">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
            </svg>
          </button>
          <button id="refresh-btn" class="icon-btn" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.65-6.36" />
              <polyline points="21 3 21 9 15 9" />
            </svg>
          </button>
        </div>
      </header>

      <nav id="view-tabs" class="view-tabs"></nav>
      <nav id="tabs" class="tabs"></nav>

      <div id="news-banner" class="news-banner" hidden></div>

      <main id="content" class="content">
        <p class="empty-state">Loading dashboard...</p>
      </main>

      <p id="last-update" class="last-update"></p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
