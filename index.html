<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gold S/R Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-eyebrow" id="brand-eyebrow">Gold · XAU/USD</span>
          <h1 class="brand-title">Support <span class="amp">&amp;</span> Resistance</h1>
        </div>
        <div class="topbar-actions">
          <div class="price-block">
            <span class="price-label">Spot</span>
            <span id="price-display" class="price-display">—</span>
          </div>
          <button id="notify-btn" class="icon-btn" title="Enable price alerts" aria-label="Enable price alerts">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
            </svg>
          </button>
          <button id="refresh-btn" class="icon-btn" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.65-6.36" />
              <polyline points="21 3 21 9 15 9" />
            </svg>
          </button>
        </div>
      </header>

      <nav id="symbol-tabs" class="symbol-tabs"></nav>
      <nav id="view-tabs" class="view-tabs"></nav>
      <nav id="tabs" class="tabs"></nav>

      <div id="position-settings" class="position-settings">
        <label>Balance
          <input id="ps-balance" type="number" min="0" step="100" />
        </label>
        <label>Risk %
          <input id="ps-risk" type="number" min="0" step="0.1" />
        </label>
        <label>Units/lot
          <input id="ps-units" type="number" min="1" step="1" />
        </label>
      </div>

      <div id="news-banner" class="news-banner" hidden></div>

      <div id="chart-container" class="chart-container"></div>

      <main id="content" class="content">
        <p class="empty-state">Loading dashboard...</p>
      </main>

      <p id="last-update" class="last-update"></p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
